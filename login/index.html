<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQ大乐斗 - 扫码登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 50px 60px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .logo { font-size: 28px; font-weight: bold; color: #333; margin-bottom: 8px; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 30px; }
        .qr-wrapper {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            position: relative;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qr-wrapper img {
            width: 100%;
            max-width: 280px;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 8px;
        }
        .qr-wrapper .placeholder { color: #aaa; font-size: 14px; }
        .qr-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .qr-overlay.show { display: flex; }
        .qr-overlay .icon { font-size: 48px; margin-bottom: 12px; }
        .qr-overlay .text { font-size: 16px; color: #333; }
        .qr-overlay .sub-text { font-size: 13px; color: #888; margin-top: 4px; }
        .status-box {
            background: #f0f4ff;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 20px;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 15px;
            color: #444;
            transition: all 0.3s;
        }
        .status-box .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e0e0e0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .status-box .spinner.hidden { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-box.success { background: #e8f5e9; color: #2e7d32; }
        .status-box.error { background: #ffebee; color: #c62828; }
        .btn {
            display: inline-block;
            padding: 12px 40px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-secondary { background: #e0e0e0; color: #555; }
        .btn-secondary:hover { background: #d0d0d0; box-shadow: none; }
        .btn-small {
            padding: 8px 20px;
            font-size: 13px;
        }
        .btn-success {
            background: #4caf50;
        }
        .btn-success:hover {
            background: #43a047;
        }
        .tips { font-size: 13px; color: #999; margin-top: 20px; line-height: 1.6; }
        .tips strong { color: #667eea; }

        .divider {
            display: flex;
            align-items: center;
            margin: 16px 0;
            color: #ccc;
            font-size: 13px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }
        .divider::before { margin-right: 16px; }
        .divider::after { margin-left: 16px; }

        .login-form {
            display: none;
            margin-top: 12px;
        }
        .login-form.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-form .form-group {
            margin-bottom: 10px;
            text-align: left;
        }
        .login-form .form-group label {
            display: block;
            font-weight: 500;
            color: #555;
            font-size: 13px;
            margin-bottom: 3px;
        }
        .login-form .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.3s;
            outline: none;
        }
        .login-form .form-group input:focus {
            border-color: #667eea;
        }
        .login-form .btn {
            width: 100%;
            padding: 12px;
            font-size: 15px;
        }
        .login-form .form-error {
            color: #c62828;
            font-size: 13px;
            text-align: center;
            display: none;
            margin-top: 6px;
        }
        .login-form .form-error.show {
            display: block;
        }
        .toggle-login {
            color: #667eea;
            cursor: pointer;
            font-size: 13px;
            text-decoration: underline;
        }
        .toggle-login:hover {
            color: #5a4fcf;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: white;
            border-radius: 20px;
            padding: 35px 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal h3 { font-size: 22px; color: #333; margin-bottom: 8px; text-align: center; }
        .modal .modal-sub { font-size: 14px; color: #888; text-align: center; margin-bottom: 20px; }
        .modal .form-group { margin-bottom: 14px; text-align: left; }
        .modal .form-group label { display: block; font-weight: 500; color: #555; font-size: 14px; margin-bottom: 4px; }
        .modal .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .modal .form-group input:focus { outline: none; border-color: #667eea; }
        .modal .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
        .modal .modal-actions .btn { flex: 1; padding: 12px 20px; text-align: center; }
        .modal .modal-actions .btn-secondary { background: #e0e0e0; color: #555; }
        .modal .modal-actions .btn-secondary:hover { background: #d0d0d0; box-shadow: none; }
        .modal .modal-error { color: #c62828; font-size: 13px; text-align: center; display: none; margin-bottom: 10px; }
        .modal .modal-error.show { display: block; }
        .modal .modal-qq { text-align: center; font-size: 14px; color: #667eea; font-weight: 600; margin-bottom: 16px; padding: 8px 12px; background: #f0f4ff; border-radius: 8px; }

        .back-link {
            display: inline-block;
            margin-top: 12px;
            color: #667eea;
            cursor: pointer;
            font-size: 13px;
            text-decoration: underline;
        }
        .back-link:hover {
            color: #5a4fcf;
        }

        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            .qr-wrapper img { max-width: 200px; }
            .modal { padding: 25px 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎮 QQ大乐斗</div>
        <div class="subtitle" id="pageSubtitle">扫码登录助手</div>
        
        <div class="qr-wrapper" id="qrWrapper">
            <img id="qrImage" src="" alt="二维码" style="display:none;">
            <span class="placeholder" id="placeholder">⏳ 加载中...</span>
            <div class="qr-overlay" id="qrOverlay">
                <div class="icon">✅</div>
                <div class="text" id="overlayText">登录成功！</div>
                <div class="sub-text" id="overlaySubText">正在跳转...</div>
            </div>
        </div>
        
        <div class="status-box" id="statusBox">
            <span class="spinner" id="spinner"></span>
            <span id="statusText">正在初始化...</span>
        </div>
        
        <div class="actions">
            <button class="btn" id="btnRefresh" style="display:none;">🔄 刷新二维码</button>
            <button class="btn btn-success" id="btnContinue" style="display:none;">✅ 继续添加</button>
        </div>

        <div class="divider">
            <span>或</span>
        </div>

        <div style="text-align:center;">
            <span class="toggle-login" id="toggleLogin">🔑 使用账号密码登录</span>
        </div>

        <!-- 密码登录表单 -->
        <div class="login-form" id="loginForm">
            <div class="form-group">
                <label>QQ号</label>
                <input type="text" id="loginUsername" placeholder="请输入QQ号">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码">
            </div>
            <div class="form-error" id="loginError">登录失败，请检查账号和密码</div>
            <button class="btn" id="loginBtn">登 录</button>
            <div style="margin-top:8px;font-size:12px;color:#999;">
                <span class="toggle-login" id="toggleBack">← 返回扫码登录</span>
            </div>
        </div>
        
        <div class="tips" id="tipsArea">
            💡 提示：请使用 <strong>手机QQ</strong> 扫描二维码登录
            <br>
            <span id="loginHint">首次登录需设置密码，之后使用 QQ号 + 密码 登录</span>
        </div>

        <div id="backLink" style="display:none; margin-top:12px;">
            <span class="back-link" onclick="closeWindow()">← 返回主面板</span>
        </div>
    </div>
    
    <!-- 密码设置弹窗 -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal">
            <h3>🔐 设置登录密码</h3>
            <p class="modal-sub">首次登录，请为你的账号设置密码</p>
            <div class="modal-qq">QQ号: <span id="modalQQNum">---</span></div>
            <div class="modal-error" id="modalError">密码至少6位</div>
            <div class="form-group">
                <label>密码（至少6位）</label>
                <input type="password" id="regPassword" placeholder="请输入密码" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="regPasswordConfirm" placeholder="请再次输入密码" autocomplete="new-password">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="modalCancel">取消</button>
                <button class="btn" id="modalConfirm">✅ 确认设置</button>
            </div>
        </div>
    </div>
    
    <script>
        class QQLogin {
            constructor() {
                this.qrsig = null;
                this.isPolling = false;
                this.pollTimer = null;
                this.isAutoLoading = false;
                this.pendingRegisterData = null;
                this.isAddMode = false;
                
                this.elements = {
                    qrImage: document.getElementById('qrImage'),
                    qrWrapper: document.getElementById('qrWrapper'),
                    placeholder: document.getElementById('placeholder'),
                    qrOverlay: document.getElementById('qrOverlay'),
                    overlayText: document.getElementById('overlayText'),
                    overlaySubText: document.getElementById('overlaySubText'),
                    statusBox: document.getElementById('statusBox'),
                    spinner: document.getElementById('spinner'),
                    statusText: document.getElementById('statusText'),
                    btnRefresh: document.getElementById('btnRefresh'),
                    btnContinue: document.getElementById('btnContinue'),
                    loginHint: document.getElementById('loginHint'),
                    toggleLogin: document.getElementById('toggleLogin'),
                    toggleBack: document.getElementById('toggleBack'),
                    loginForm: document.getElementById('loginForm'),
                    loginUsername: document.getElementById('loginUsername'),
                    loginPassword: document.getElementById('loginPassword'),
                    loginError: document.getElementById('loginError'),
                    loginBtn: document.getElementById('loginBtn'),
                    tipsArea: document.getElementById('tipsArea'),
                    pageSubtitle: document.getElementById('pageSubtitle'),
                    backLink: document.getElementById('backLink'),
                    passwordModal: document.getElementById('passwordModal'),
                    modalQQNum: document.getElementById('modalQQNum'),
                    regPassword: document.getElementById('regPassword'),
                    regPasswordConfirm: document.getElementById('regPasswordConfirm'),
                    modalError: document.getElementById('modalError'),
                    modalConfirm: document.getElementById('modalConfirm'),
                    modalCancel: document.getElementById('modalCancel'),
                };
                
                this.bindEvents();
                this.autoInit();
            }
            
            bindEvents() {
                this.elements.btnRefresh.addEventListener('click', () => this.startLogin());
                this.elements.btnContinue.addEventListener('click', () => {
                    window.location.reload();
                });
                this.elements.modalConfirm.addEventListener('click', () => this.confirmPassword());
                this.elements.modalCancel.addEventListener('click', () => this.cancelPassword());
                this.elements.regPassword.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') this.confirmPassword();
                });
                this.elements.regPasswordConfirm.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') this.confirmPassword();
                });
                this.elements.passwordModal.addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) this.cancelPassword();
                });
                
                this.elements.toggleLogin.addEventListener('click', () => {
                    this.elements.loginForm.classList.add('show');
                    this.elements.qrWrapper.style.display = 'none';
                    this.elements.btnRefresh.style.display = 'none';
                    this.elements.toggleLogin.style.display = 'none';
                    this.elements.statusBox.style.display = 'none';
                });
                
                this.elements.toggleBack.addEventListener('click', () => {
                    this.elements.loginForm.classList.remove('show');
                    this.elements.qrWrapper.style.display = 'flex';
                    this.elements.btnRefresh.style.display = 'inline-block';
                    this.elements.toggleLogin.style.display = 'inline';
                    this.elements.statusBox.style.display = 'flex';
                    this.elements.loginError.classList.remove('show');
                });
                
                this.elements.loginBtn.addEventListener('click', () => this.handleLogin());
                this.elements.loginUsername.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') this.handleLogin();
                });
                this.elements.loginPassword.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') this.handleLogin();
                });
            }
            
            closeWindow() {
                window.close();
            }
            
            setStatus(text, type = 'info') {
                const box = this.elements.statusBox;
                const textEl = this.elements.statusText;
                const spinner = this.elements.spinner;
                box.classList.remove('success', 'error');
                textEl.textContent = text;
                if (type === 'info') {
                    spinner.classList.remove('hidden');
                } else {
                    spinner.classList.add('hidden');
                    if (type === 'success') box.classList.add('success');
                    else if (type === 'error') box.classList.add('error');
                }
            }
            
            showQR(imageData) {
                this.elements.qrImage.src = imageData;
                this.elements.qrImage.style.display = 'block';
                this.elements.placeholder.style.display = 'none';
                this.elements.qrOverlay.classList.remove('show');
                this.elements.btnRefresh.style.display = 'inline-block';
                this.elements.btnContinue.style.display = 'none';
            }
            
            showOverlay(icon, text, subText) {
                const overlay = this.elements.qrOverlay;
                overlay.querySelector('.icon').textContent = icon;
                this.elements.overlayText.textContent = text;
                this.elements.overlaySubText.textContent = subText || '';
                overlay.classList.add('show');
            }
            
            hideOverlay() {
                this.elements.qrOverlay.classList.remove('show');
            }
            
            resetUI() {
                this.elements.qrImage.style.display = 'none';
                this.elements.placeholder.style.display = 'block';
                this.elements.placeholder.textContent = '点击刷新按钮获取二维码';
                this.hideOverlay();
                this.elements.btnRefresh.style.display = 'inline-block';
            }
            
            async api(action, params = {}, options = {}) {
                let url = 'api.php?action=' + encodeURIComponent(action);
                if (params && typeof params === 'object') {
                    for (const [key, value] of Object.entries(params)) {
                        if (value !== null && value !== undefined && value !== '') {
                            url += '&' + encodeURIComponent(key) + '=' + encodeURIComponent(value);
                        }
                    }
                }
                const fetchOptions = {
                    method: options.method || 'GET',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                };
                if (options.method === 'POST' && options.body) {
                    fetchOptions.body = options.body;
                }
                try {
                    const response = await fetch(url, fetchOptions);
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    const text = await response.text();
                    if (!text || text.trim() === '') throw new Error('服务器返回空响应');
                    try { return JSON.parse(text); } catch (e) {
                        throw new Error('服务器返回无效 JSON: ' + text.substring(0, 100));
                    }
                } catch (error) {
                    console.error('API Error:', error);
                    return { success: false, error: error.message };
                }
            }
            
            // ========== 密码登录 ==========
            async handleLogin() {
                const username = this.elements.loginUsername.value.trim();
                const password = this.elements.loginPassword.value;
                const errorEl = this.elements.loginError;
                
                if (!username || !password) {
                    errorEl.textContent = '请填写完整信息';
                    errorEl.classList.add('show');
                    return;
                }
                
                errorEl.classList.remove('show');
                this.elements.loginBtn.disabled = true;
                this.elements.loginBtn.textContent = '登录中...';
                
                try {
                    const result = await this.api('login', {}, {
                        method: 'POST',
                        body: JSON.stringify({ username, password })
                    });
                    
                    if (result.success) {
                        window.location.href = '../index.php';
                    } else {
                        errorEl.textContent = result.error || '登录失败，请检查账号和密码';
                        errorEl.classList.add('show');
                        this.elements.loginBtn.disabled = false;
                        this.elements.loginBtn.textContent = '登 录';
                    }
                } catch (error) {
                    errorEl.textContent = '网络错误: ' + error.message;
                    errorEl.classList.add('show');
                    this.elements.loginBtn.disabled = false;
                    this.elements.loginBtn.textContent = '登 录';
                }
            }
            
            // ========== 自动初始化 ==========
            async autoInit() {
                // ========== 安装检测 ==========
                try {
                    const response = await fetch('../install.lock', { method: 'HEAD' });
                    if (!response.ok) {
                        window.location.href = '../install.php';
                        return;
                    }
                } catch (e) {
                    window.location.href = '../install.php';
                    return;
                }

                if (this.isAutoLoading) return;
                this.isAutoLoading = true;
                this.setStatus('正在初始化...', 'info');
                this.elements.placeholder.textContent = '⏳ 加载中...';
                
                // ========== 检测是否为添加账号模式 ==========
                const urlParams = new URLSearchParams(window.location.search);
                const isAddMode = urlParams.get('action') === 'add';
                if (isAddMode) {
                    this.isAddMode = true;
                    this.elements.pageSubtitle.textContent = '扫码添加新账号';
                    this.elements.tipsArea.innerHTML = '📌 扫码添加新QQ号到当前账户<br>扫码后自动添加，无需设置密码';
                    this.elements.loginHint.textContent = '扫码后将自动添加到当前账户';
                    this.elements.backLink.style.display = 'block';
                }
                
                try {
                    const checkResult = await this.api('check');
                    if (checkResult.success && checkResult.loggedIn) {
                        if (isAddMode) {
                            // ✅ 添加账号模式：保持登录，显示二维码
                            this.setStatus('📌 请扫码添加新账号', 'info');
                            this.elements.loginHint.textContent = '扫码后将自动添加到当前账户';
                            const result = await this.api('start');
                            if (!result.success) {
                                this.setStatus('❌ ' + (result.error || '获取二维码失败'), 'error');
                                this.isAutoLoading = false;
                                return;
                            }
                            this.qrsig = result.qrsig;
                            this.showQR(result.qrImage);
                            this.startPolling();
                            this.isAutoLoading = false;
                            return;
                        } else {
                            this.setStatus('✅ 已登录，正在跳转...', 'success');
                            this.showOverlay('✅', '已登录', '正在进入主页面...');
                            setTimeout(() => { window.location.href = '../index.php'; }, 800);
                            this.isAutoLoading = false;
                            return;
                        }
                    }
                    
                    // 未登录，显示二维码
                    this.setStatus('正在获取二维码...', 'info');
                    const result = await this.api('start');
                    if (!result.success) {
                        this.setStatus('❌ ' + (result.error || '获取二维码失败'), 'error');
                        this.elements.placeholder.textContent = '点击刷新按钮重试';
                        this.elements.btnRefresh.style.display = 'inline-block';
                        this.isAutoLoading = false;
                        return;
                    }
                    this.qrsig = result.qrsig;
                    this.showQR(result.qrImage);
                    this.setStatus('📱 请用手机QQ扫描二维码', 'info');
                    this.startPolling();
                } catch (error) {
                    this.setStatus('❌ 初始化失败: ' + error.message, 'error');
                    this.elements.placeholder.textContent = '点击刷新按钮重试';
                    this.elements.btnRefresh.style.display = 'inline-block';
                }
                this.isAutoLoading = false;
            }
            
            async startLogin() {
                try {
                    this.stopPolling();
                    this.setStatus('正在获取二维码...', 'info');
                    this.hideOverlay();
                    this.elements.qrImage.style.display = 'none';
                    this.elements.placeholder.textContent = '⏳ 加载中...';
                    this.elements.btnRefresh.disabled = true;
                    const result = await this.api('start');
                    this.elements.btnRefresh.disabled = false;
                    if (!result.success) {
                        this.setStatus('❌ ' + (result.error || '获取二维码失败'), 'error');
                        this.elements.placeholder.textContent = '点击刷新按钮重试';
                        this.elements.placeholder.style.display = 'block';
                        return;
                    }
                    this.qrsig = result.qrsig;
                    this.showQR(result.qrImage);
                    this.setStatus('📱 请用手机QQ扫描二维码', 'info');
                    this.startPolling();
                } catch (error) {
                    this.setStatus('❌ 错误: ' + error.message, 'error');
                    this.elements.placeholder.textContent = '点击刷新按钮重试';
                    this.elements.placeholder.style.display = 'block';
                    this.elements.btnRefresh.disabled = false;
                }
            }
            
            async startPolling() {
                if (this.isPolling) return;
                this.isPolling = true;
                let attempts = 0;
                const maxAttempts = 120;
                const poll = async () => {
                    if (!this.isPolling) return;
                    attempts++;
                    try {
                        const result = await this.api('status', { qrsig: this.qrsig });
                        if (!result.success) {
                            this.isPolling = false;
                            this.setStatus('❌ ' + (result.error || '轮询失败'), 'error');
                            this.elements.btnRefresh.style.display = 'inline-block';
                            return;
                        }
                        switch (result.status) {
                            case 'waiting':
                                this.setStatus(`⏳ 等待扫码... (${attempts}/${maxAttempts})`, 'info');
                                break;
                            case 'scanned':
                                this.setStatus(`📱 已扫码，请在手机上确认登录 (${attempts}/${maxAttempts})`, 'info');
                                break;
                            case 'success':
                                this.isPolling = false;
                                this.setStatus('✅ 扫码成功，正在处理...', 'success');
                                this.showOverlay('✅', '扫码成功！', '正在处理...');
                                
                                const loginData = {
                                    username: result.gameCookies?.newuin || '',
                                    newuin: result.gameCookies?.newuin || '',
                                    openId: result.gameCookies?.openId || '',
                                    accessToken: result.gameCookies?.accessToken || '',
                                    nickname: result.nickname || result.gameCookies?.newuin || ''
                                };
                                
                                if (!loginData.newuin) {
                                    this.setStatus('❌ 未获取到 QQ 号，请重试', 'error');
                                    return;
                                }
                                
                                // ========== 添加账号模式 ==========
                                if (this.isAddMode) {
                                    const addResult = await this.api('addAccount', {}, {
                                        method: 'POST',
                                        body: JSON.stringify({
                                            openId: loginData.openId,
                                            newuin: loginData.newuin,
                                            accessToken: loginData.accessToken,
                                            nickname: loginData.nickname
                                        })
                                    });
                                    if (addResult.success) {
                                        this.setStatus('✅ 账号添加成功！', 'success');
                                        this.showOverlay('✅', '添加成功！', 'QQ号: ' + loginData.newuin + ' 已添加到当前账户');
                                        this.elements.btnRefresh.style.display = 'none';
                                        this.elements.btnContinue.style.display = 'inline-block';
                                        this.elements.btnContinue.textContent = '✅ 继续添加';
                                    } else {
                                        this.setStatus('❌ 添加失败: ' + (addResult.error || '未知错误'), 'error');
                                        this.elements.btnRefresh.style.display = 'inline-block';
                                        this.elements.btnRefresh.textContent = '🔄 重试';
                                    }
                                    return;
                                }
                                
                                // ========== 正常登录模式 ==========
                                this.pendingRegisterData = loginData;
                                this.showPasswordModal(loginData.newuin);
                                return;
                            case 'expired':
                                this.isPolling = false;
                                this.setStatus('❌ 二维码已过期，请重新获取', 'error');
                                this.showOverlay('⏰', '二维码已过期', '请点击刷新按钮重新获取');
                                this.elements.btnRefresh.style.display = 'inline-block';
                                return;
                            default:
                                this.setStatus(`⏳ 等待中... (${attempts}/${maxAttempts})`, 'info');
                        }
                        if (this.isPolling && attempts < maxAttempts) {
                            this.pollTimer = setTimeout(poll, 1000);
                        } else if (attempts >= maxAttempts) {
                            this.isPolling = false;
                            this.setStatus('⏰ 扫码超时，请重试', 'error');
                            this.showOverlay('⏰', '扫码超时', '请点击刷新按钮重新获取');
                            this.elements.btnRefresh.style.display = 'inline-block';
                        }
                    } catch (error) {
                        console.error('轮询错误:', error);
                        this.isPolling = false;
                        this.setStatus('❌ 轮询错误: ' + error.message, 'error');
                    }
                };
                poll();
            }
            
            showPasswordModal(newuin) {
                this.elements.modalQQNum.textContent = newuin || '---';
                this.elements.regPassword.value = '';
                this.elements.regPasswordConfirm.value = '';
                this.elements.modalError.classList.remove('show');
                this.elements.passwordModal.classList.add('show');
                setTimeout(() => this.elements.regPassword.focus(), 300);
            }
            
            hidePasswordModal() {
                this.elements.passwordModal.classList.remove('show');
            }
            
            async confirmPassword() {
                const password = this.elements.regPassword.value;
                const confirm = this.elements.regPasswordConfirm.value;
                const errorEl = this.elements.modalError;
                
                if (password.length < 6) {
                    errorEl.textContent = '⚠️ 密码至少6位';
                    errorEl.classList.add('show');
                    return;
                }
                if (password !== confirm) {
                    errorEl.textContent = '⚠️ 两次密码输入不一致';
                    errorEl.classList.add('show');
                    return;
                }
                if (!this.pendingRegisterData) {
                    errorEl.textContent = '⚠️ 登录数据丢失，请重新扫码';
                    errorEl.classList.add('show');
                    return;
                }
                errorEl.classList.remove('show');
                this.hidePasswordModal();
                this.setStatus('⏳ 正在注册账号...', 'info');
                
                try {
                    const registerData = {
                        username: this.pendingRegisterData.newuin,
                        password: password,
                        openId: this.pendingRegisterData.openId,
                        accessToken: this.pendingRegisterData.accessToken,
                        newuin: this.pendingRegisterData.newuin,
                        nickname: this.pendingRegisterData.nickname
                    };
                    const result = await this.api('register', {}, {
                        method: 'POST',
                        body: JSON.stringify(registerData)
                    });
                    if (result.success) {
                        this.setStatus('✅ ' + result.message + '，正在跳转...', 'success');
                        this.showOverlay('✅', '注册成功！', '即将进入主面板...');
                        this.elements.btnRefresh.style.display = 'none';
                        this.elements.loginHint.textContent = '✅ 已登录，使用 QQ号 + 密码 登录';
                        setTimeout(() => { window.location.href = '../index.php'; }, 1200);
                    } else {
                        this.setStatus('❌ ' + (result.error || '注册失败'), 'error');
                    }
                } catch (error) {
                    this.setStatus('❌ 注册失败: ' + error.message, 'error');
                }
                this.pendingRegisterData = null;
            }
            
            cancelPassword() {
                this.hidePasswordModal();
                this.pendingRegisterData = null;
                this.setStatus('❌ 已取消注册', 'error');
                this.elements.btnRefresh.style.display = 'inline-block';
            }
            
            stopPolling() {
                this.isPolling = false;
                if (this.pollTimer) {
                    clearTimeout(this.pollTimer);
                    this.pollTimer = null;
                }
            }
        }
        
        function closeWindow() {
            window.close();
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            const login = new QQLogin();
            window.qqLogin = login;
        });
    </script>
</body>
